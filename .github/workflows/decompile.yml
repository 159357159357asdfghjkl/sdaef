name: decompile

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      path:
        description: 'A .cppia to decompile instead of the test module, or a directory to search'
        required: false
        default: ''
      all:
        description: 'Keep the generated types that are skipped by default'
        type: boolean
        default: false

jobs:
  module:
    if: ${{ inputs.path == '' }}
    runs-on: ubuntu-latest
    container: haxe:4.3.6

    steps:
      - name: Install git so checkout can use it
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git

      - uses: actions/checkout@v4

  decompile:
    needs: [module]
    if: ${{ always() && !cancelled() && (needs.module.result == 'success' || needs.module.result == 'skipped') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build the decompiler
        run: dotnet build CPPIADecompiler.csproj --configuration Release

      - name: Build the decompiler
        run: dotnet build CPPIADecompiler.csproj --configuration Release

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decompiler
          path: |
            bin/Release/net*/
            !bin/Release/net/**/*.pdb
          if-no-files-found: error
          retention-days: 14
